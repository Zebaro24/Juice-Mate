[tool.poetry]
name = "juice-mate"
version = "0.1.0"
description = "Windows tray app: battery of Bluetooth/HID devices and Claude usage limits, self-updating."
authors = ["Zebaro"]
readme = "README.md"
packages = [{ include = "juice_mate", from = "src" }]

# ───────────────────────────────────────────────────────────────────────────
# Runtime dependencies
# ───────────────────────────────────────────────────────────────────────────
[tool.poetry.dependencies]
python = ">=3.13,<3.14"
# --- Tray icon (native NotifyIcon underneath) and drawing the numbers on it ---
pystray = "^0.19.5"
pillow = "^13.0.0"
# --- System sensors: network, CPU, memory, disk (no kernel driver) ---
psutil = "^7.2.2"
# --- HID feature reports: the Hator mouse dongle ---
hidapi = "^0.15.0"
# --- HTTP: Claude usage limits ---
httpx = "^0.28.1"
# --- Windows notifications (low battery) ---
windows-toasts = "^1.3.1"
# --- Self-update from GitHub Releases ---
velopack = "^1.2.161"
# --- Safe XML parsing: tech news RSS for the Claude Code run's prompt ---
defusedxml = "^0.7.1"

# ───────────────────────────────────────────────────────────────────────────
# Development dependencies
# ───────────────────────────────────────────────────────────────────────────
[tool.poetry.group.dev.dependencies]
ruff = "^0.17.1"
mypy = "^2.4.0"
pytest = "^9.1.1"
pip-audit = "^2.10.1"
types-psutil = "^7.2.2.20260906"
# --- Build: the windowed exe that Velopack packs (scripts/build.py) ---
pyinstaller = "^6.22.3"
types-defusedxml = "^0.7.0.20260504"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ===========================================================================
# Tooling — one source of truth, run only through scripts/gate.py
# ===========================================================================
[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["_temp", "_ideas", ".claude", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "S",        # bandit
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]  # asserts; fake tokens in fixtures

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# No type stubs are published for pystray or hidapi.
module = ["pystray", "pystray.*", "hid"]
ignore_missing_imports = true

[tool.pyright]
# For the editor only; the gate runs mypy.
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
