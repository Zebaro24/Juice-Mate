name: Release

# A `vX.Y.Z` tag builds the windowed app, packs it with Velopack and publishes Setup.exe + update
# packages to this repo's GitHub Releases, where installed copies find them (docs/architecture.md §4).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"
          cache: pip  # Poetry itself
          cache-dependency-path: poetry.lock
      # The same environment cache as ci.yml: a tag right after a push reuses what CI just built.
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Poetry and dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.in-project true
          poetry install --no-interaction
      - name: Gate
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/gate.py --strict
      - name: Version must match the tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "VERSION $version does not match tag ${{ github.ref_name }}" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build
        run: poetry run python scripts/build.py
      - name: Install vpk
        run: dotnet tool install -g vpk
      - name: Fetch the previous release (for delta updates)
        continue-on-error: true  # the first release has nothing to fetch
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
      - name: Release notes — this version's CHANGELOG section only
        run: python scripts/release_notes.py ${{ env.VERSION }} > build/notes.md
      - name: Pack
        run: >
          vpk pack --packId JuiceMate --packVersion ${{ env.VERSION }} --packDir dist/JuiceMate
          --mainExe JuiceMate.exe --packTitle Juice-Mate --packAuthors Zebaro --icon build/icon.ico
          --releaseNotes build/notes.md
      - name: Publish
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish
          --releaseName "Juice-Mate ${{ env.VERSION }}" --tag ${{ github.ref_name }} --token ${{ secrets.GITHUB_TOKEN }}
      - name: Release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --notes-file build/notes.md
